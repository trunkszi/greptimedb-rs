[package]
name = "greptimedb-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Generated protobuf messages and grpc-rs service bindings for GreptimeDB and Arrow Flight"
build = "build.rs"

[lib]
# Prost copies proto comments into rustdoc; indented examples in those comments
# are not Rust doctests. Keep doctests off for this generated crate.
doctest = false

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
grpc-core = { workspace = true }
grpc-macros = { workspace = true }

[dev-dependencies]
grpc = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
grpc-build = { workspace = true, default-features = false, features = ["protobuf"] }

[lints]
workspace = true
