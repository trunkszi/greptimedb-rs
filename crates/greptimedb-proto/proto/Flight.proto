syntax = "proto3";

package arrow.flight.protocol;

// Arrow Flight messages used by GreptimeDB's DoPut and DoGet endpoints.
// Subset of Apache Arrow's Flight.protocol definition (Apache-2.0):
// https://github.com/apache/arrow/blob/main/format/Flight.proto
// Field numbers and types match the upstream file.

message FlightDescriptor {
  enum DescriptorType {
    UNKNOWN = 0;
    PATH = 1;
    CMD = 2;
  }

  DescriptorType type = 1;
  bytes cmd = 2;
  repeated string path = 3;
}

message Ticket {
  bytes ticket = 1;
}

message FlightData {
  FlightDescriptor flight_descriptor = 1;
  bytes data_header = 2;
  bytes app_metadata = 3;
  bytes data_body = 1000;
}

message PutResult {
  bytes app_metadata = 1;
}

service FlightService {
  rpc DoGet(Ticket) returns (stream FlightData);
  rpc DoPut(stream FlightData) returns (stream PutResult);
}
