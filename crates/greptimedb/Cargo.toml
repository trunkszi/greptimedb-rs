[package]
name = "greptimedb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Synchronous, completion-driven, thread-affine Rust SDK for GreptimeDB"

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile"]

[dependencies]
greptimedb-proto = { workspace = true }
greptimedb-macros = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
grpc = { workspace = true }
socket2 = { workspace = true }
libc = { workspace = true }
liburing = { workspace = true }
cares = { workspace = true }
prost = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
base64 = { workspace = true }
serde = { workspace = true }
sonic-rs = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
rcgen = { workspace = true }

[lints]
workspace = true
